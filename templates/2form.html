<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário POST</title>
</head>
<body>
    <form method="post">

        <label>Nome:</label>
        <input type="text" name="nome" required>

        <button type="submit">
            Enviar
        </button>

    </form>
    {% if nome %}
        <h2>Olá, {{ nome }}!</h2>
    {% endif %}
</body>
</html>
