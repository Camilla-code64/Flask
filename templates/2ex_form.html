<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form method="post">

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Idade:</label>
        <input type="number" name="idade">

        <br><br>

        <label>Curso:</label>
        <input type="text" name="curso">

        <button type="submit">Cadastrar</button>
    </form>

    {% if nome and email and idade and curso %}
        <h2>Dados recebidos</h2>
        <p>Nome: {{ nome }}</p>
        <p>E-mail: {{ email }}</p>
        <p>Idade: {{ idade }}</p>
        <p>Curso: {{ curso }}</p>
    {% endif %}
</body>
</html>
