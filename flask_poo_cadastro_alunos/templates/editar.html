{% extends "base.html" %}

{% block title %}Editar Aluno{% endblock %}

{% block content %}
<h2>Editar aluno #{{ aluno.id }}</h2>
<form method="post" action="{{ url_for('editar', id=aluno.id) }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" value="{{ aluno.nome }}" required>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ aluno.email }}" required>

    <label for="curso">Curso</label>
    <input id="curso" name="curso" type="text" value="{{ aluno.curso }}" required>

    <button type="submit">Salvar alterações</button>
    <a href="{{ url_for('inicio') }}">Cancelar</a>
</form>
{% endblock %}
